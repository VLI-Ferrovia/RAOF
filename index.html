<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acionamentos RAOF</title>
    <link rel="icon" type="image/png" href="faviconraof.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --danger: #e74c3c; --success: #27ae60; --bg: #f4f7f9; }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg); margin: 0; }
        .header { background: var(--primary); color: white; padding: 0.8rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 10px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 1rem; }
        .section-title { font-size: 0.75rem; font-weight: 700; color: #95a5a6; text-transform: uppercase; margin-bottom: 0.8rem; display: block; }
        .selector-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; cursor: pointer; }
        input[type="time"].empty { background-color: #fff; border: 1px solid #ddd; }
        input[type="time"].filled { background-color: #f0fff4; border: 1px solid #9ae6b4; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; background: #f8f9fa; padding: 12px; border-bottom: 2px solid #eee; font-size: 0.85rem; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .td-input { border: 1px solid #ddd; padding: 8px; border-radius: 6px; width: 90%; }
        .btn-action { padding: 10px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-pdf { background: var(--accent); color: white; float: right; margin-top: 10px; }
        .btn-procedimento { background: #3599db; color: white; }
        .header-btn { min-width: 100px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1100; }
        .modal-content { background: white; border-radius: 14px; max-width: 380px; width: 90%; padding: 1.5rem; box-shadow: 0 12px 32px rgba(0,0,0,0.15); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .modal-header h3 { margin: 0; font-size: 1rem; color: #2c3e50; }
        .modal-close { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: #7f8c8d; }
        .modal-body button { width: 100%; margin-bottom: 0.75rem; }
        .proc-view { display: inline-block; margin-top: 10px; padding: 5px 10px; background: #edf2f7; border-radius: 5px; font-size: 0.8rem; cursor: pointer; color: #2d3748; border: 1px solid #cbd5e0; }
        .hidden { display: none; }
        .barra-final { display: flex; justify-content: space-between; align-items: center; }
        .card-secao { border-top: 5px solid var(--accent); }
        .card-secao.zona { border-top-color: #e67e22; }
        .card-secao.cenario { border-top-color: #8e44ad; }
        .secao-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
        .secao-titulo { margin: 0; font-size: 1rem; color: var(--primary); }
        .secao-sub { font-size: 0.85rem; color: #7f8c8d; }
        .resumo { font-size: 0.8rem; color: #555; font-weight: 600; }
        /* Cores conforme o status do acionamento */
        tr.st-pendente td { background: #fff; }
        tr.st-acionado td { background: #e8f8ef; }
        tr.st-semcontato td { background: #fdecea; }
        tr.st-acionado td:first-child { border-left: 5px solid var(--success); }
        tr.st-semcontato td:first-child { border-left: 5px solid var(--danger); }
        tr.st-pendente td:first-child { border-left: 5px solid #cfd8dc; }
        .btn-status { min-width: 128px; padding: 8px 10px; border-radius: 20px; border: 2px solid transparent; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
        .btn-status.st-pendente { background: #eceff1; color: #546e7a; border-color: #cfd8dc; }
        .btn-status.st-acionado { background: var(--success); color: #fff; }
        .btn-status.st-semcontato { background: var(--danger); color: #fff; }
        @media (max-width: 760px) { .selector-grid { grid-template-columns: 1fr; } .card { overflow-x: auto; } }
    </style>
</head>
<body>

<header class="header">
    <div><h2>Acionamentos RAOF</h2></div>
    <div style="display:flex; gap:10px;">
        <button class="btn-action btn-procedimento header-btn" onclick="abrirModalProcedimento()">Procedimento</button>
    </div>
</header>

<div class="container">
    <div id="aba-operacao">
        <div class="card">
            <div class="selector-grid">
                <div><span class="section-title">Classe/natureza</span><select id="selClasse" onchange="gerarTabela()"></select></div>
                <div><span class="section-title">Zona Quente</span><select id="selZona" onchange="gerarTabela()"></select></div>
                <div><span class="section-title"> Cenário Associado</span><select id="selCenario" onchange="gerarTabela()"></select></div>
            </div>
            <div id="links-procedimentos" style="margin-top:15px; display:flex; gap:10px;"></div>
        </div>

        <div id="listas"></div>

        <div class="card barra-final">
            <button onclick="limparOperacao()" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:0.85rem;">Limpar dados</button>
            <button class="btn-action btn-pdf" style="float:none; margin:0;" onclick="gerarPDF()">📄 Gerar PDF</button>
        </div>
    </div>
</div>

<div id="modalProcedimento" class="modal hidden" onclick="fecharModalProcedimento(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3>Escolha o procedimento:</h3>
            <button class="modal-close" onclick="fecharModalProcedimento(event)">✕</button>
        </div>
        <div class="modal-body">
            <button class="btn-action btn-procedimento" onclick="abrirPDF('Cenário Associado.pdf')">Cenário Associado</button>
            <button class="btn-action btn-procedimento" onclick="abrirPDF('Fluxo RAOF.pdf')">Fluxo RAOF</button>
        </div>
    </div>
</div>

<script src="areas.js"></script>
<script>
/**
 * As áreas acionadas ficam no arquivo areas.js (editado direto no GitHub).
 * Aqui só montamos a estrutura usada pela tela.
 */
const DB = { classes: {}, zona: {}, cenarios: {} };
for (const tipo of Object.keys(DB)) {
    DB[tipo]["-- Nenhum --"] = { areas: [] };
    for (const [nome, areas] of Object.entries((typeof AREAS_ACIONADAS !== "undefined" && AREAS_ACIONADAS[tipo]) || {})) {
        DB[tipo][nome] = { areas };
    }
}

const SECOES = [
    { id: "classe",  tipo: "classes",  seletor: "selClasse",  titulo: "Acionamentos da classe / natureza", css: "" },
    { id: "zona",    tipo: "zona",     seletor: "selZona",    titulo: "Zona Quente",                       css: "zona" },
    { id: "cenario", tipo: "cenarios", seletor: "selCenario", titulo: "Cenário Associado",                 css: "cenario" }
];
const STATUS = {
    pendente:   { rotulo: "○ Pendente",    pdf: "Pendente",    proximo: "acionado" },
    acionado:   { rotulo: "✔ Acionado",    pdf: "Acionado",    proximo: "semcontato" },
    semcontato: { rotulo: "✖ Sem contato", pdf: "Sem contato", proximo: "pendente" }
};

function esc(t) {
    return String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let OperacaoAtual = {};
try { OperacaoAtual = JSON.parse(localStorage.getItem("ferro_op_temp")) || {}; } catch (e) { OperacaoAtual = {}; }

// Cada linha é identificada por "seção|área" para que a mesma área em quadros diferentes não se misture.
function chaveLinha(secao, area) { return secao + "|" + area; }

function persistir() {
    try { localStorage.setItem("ferro_op_temp", JSON.stringify(OperacaoAtual)); } catch (e) {}
}

function salvarProgresso() {
    document.querySelectorAll("tr[data-chave]").forEach(tr => {
        const chave = tr.dataset.chave;
        const antigo = OperacaoAtual[chave] || {};
        OperacaoAtual[chave] = {
            nome: tr.querySelector(".in-nome").value,
            hora: tr.querySelector(".in-hora").value,
            status: antigo.status || "pendente"
        };
    });
    persistir();
    validarCampos();
}

function alternarStatus(btn) {
    const tr = btn.closest("tr");
    salvarProgresso();
    const reg = OperacaoAtual[tr.dataset.chave];
    reg.status = STATUS[reg.status || "pendente"].proximo;
    persistir();
    aplicarStatusLinha(tr, reg.status);
    atualizarResumos();
}

function aplicarStatusLinha(tr, status) {
    tr.className = "st-" + status;
    const btn = tr.querySelector(".btn-status");
    btn.className = "btn-status st-" + status;
    btn.textContent = STATUS[status].rotulo;
}

function validarCampos() {
    document.querySelectorAll(".in-hora").forEach(input => {
        if(input.value) { input.classList.replace('empty', 'filled'); }
        else { input.classList.add('empty'); input.classList.remove('filled'); }
    });
}

function atualizarResumos() {
    SECOES.forEach(sec => {
        const el = document.getElementById("resumo-" + sec.id);
        if (!el) return;
        const linhas = [...document.querySelectorAll(`tr[data-secao="${sec.id}"]`)];
        const n = st => linhas.filter(tr => tr.classList.contains("st-" + st)).length;
        el.textContent = `Acionados ${n("acionado")} · Sem contato ${n("semcontato")} · Pendentes ${n("pendente")}`;
    });
}

let SELECAO_SALVA = {};
try { SELECAO_SALVA = JSON.parse(localStorage.getItem("ferro_sel")) || {}; } catch (e) {}

function renderSelects() {
    SECOES.forEach(sec => {
        const sel = document.getElementById(sec.seletor);
        const val = sel.value || SELECAO_SALVA[sec.id];
        sel.innerHTML = Object.keys(DB[sec.tipo]).map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
        if(DB[sec.tipo][val]) sel.value = val;
    });
    gerarTabela();
}

function gerarTabela() {
    SECOES.forEach(sec => { SELECAO_SALVA[sec.id] = document.getElementById(sec.seletor).value; });
    try { localStorage.setItem("ferro_sel", JSON.stringify(SELECAO_SALVA)); } catch (e) {}
    const alvo = document.getElementById("listas");
    alvo.innerHTML = SECOES.map(sec => {
        const nome = document.getElementById(sec.seletor).value;
        const areas = DB[sec.tipo][nome]?.areas || [];
        if (!areas.length) return "";
        const linhas = areas.map((area, i) => {
            const chave = chaveLinha(sec.id, area);
            const salvo = OperacaoAtual[chave] || { nome: "", hora: "", status: "pendente" };
            const st = STATUS[salvo.status] ? salvo.status : "pendente";
            return `<tr class="st-${st}" data-chave="${esc(chave)}" data-secao="${sec.id}" data-area="${esc(area)}">
                <td>${i+1}</td><td><strong>${esc(area)}</strong></td>
                <td><button type="button" class="btn-status st-${st}" onclick="alternarStatus(this)">${STATUS[st].rotulo}</button></td>
                <td><input type="text" class="td-input in-nome" value="${esc(salvo.nome)}" oninput="salvarProgresso()"></td>
                <td><input type="time" class="td-input in-hora" value="${esc(salvo.hora)}" oninput="salvarProgresso()">
                <button type="button" onclick="this.previousElementSibling.value=new Date().toTimeString().slice(0,5); salvarProgresso()">⏱</button></td></tr>`;
        }).join('');
        return `<div class="card card-secao ${sec.css}">
            <div class="secao-topo">
                <div><h3 class="secao-titulo">${sec.titulo}</h3><span class="secao-sub">${esc(nome.trim())}</span></div>
                <span class="resumo" id="resumo-${sec.id}"></span>
            </div>
            <table><thead><tr><th>#</th><th>Área</th><th>Status</th><th>Responsável</th><th>Hora</th></tr></thead>
            <tbody>${linhas}</tbody></table>
        </div>`;
    }).join('');
    validarCampos();
    atualizarResumos();
}

function abrirModalProcedimento() {
    const modal = document.getElementById('modalProcedimento');
    modal.classList.remove('hidden');
    modal.style.display = 'flex';
}

function fecharModalProcedimento(event) {
    if (event) event.stopPropagation();
    const modal = document.getElementById('modalProcedimento');
    modal.classList.add('hidden');
    modal.style.display = 'none';
}

function abrirPDF(nomeArquivo) {
    const url = encodeURI(nomeArquivo);
    window.open(url, '_blank');
    fecharModalProcedimento();
}

function limparOperacao() { if(confirm("Limpar preenchimento?")) { OperacaoAtual = {}; try { localStorage.removeItem("ferro_op_temp"); } catch (e) {} gerarTabela(); } }

function gerarPDF() {
    salvarProgresso();
    const { jsPDF } = window.jspdf; const doc = new jsPDF();
    const cores = { acionado: [39, 174, 96], semcontato: [231, 76, 60], pendente: [149, 165, 166] };
    doc.setFontSize(14);
    doc.text("Relatório de Acionamento Ferroviário", 14, 15);
    doc.setFontSize(9);
    doc.text("Gerado em " + new Date().toLocaleString("pt-BR"), 14, 21);
    let y = 27;
    SECOES.forEach(sec => {
        const linhas = [...document.querySelectorAll(`tr[data-secao="${sec.id}"]`)];
        if (!linhas.length) return;
        const nome = document.getElementById(sec.seletor).value.trim();
        const body = linhas.map((tr, i) => {
            const reg = OperacaoAtual[tr.dataset.chave] || {};
            return [i + 1, tr.dataset.area, STATUS[reg.status || "pendente"].pdf, reg.nome || "", reg.hora || ""];
        });
        doc.setFontSize(11);
        doc.text(sec.titulo + " - " + nome, 14, y);
        doc.autoTable({
            head: [['#', 'Área', 'Status', 'Responsável', 'Hora']], body, startY: y + 3,
            styles: { fontSize: 9 },
            didParseCell: d => {
                if (d.section === "body" && d.column.index === 2) {
                    const st = Object.keys(STATUS).find(k => STATUS[k].pdf === d.cell.raw) || "pendente";
                    d.cell.styles.textColor = cores[st]; d.cell.styles.fontStyle = "bold";
                }
            }
        });
        y = doc.lastAutoTable.finalY + 10;
    });
    doc.save("Relatorio_Acionamento.pdf");
}

renderSelects();
</script>
</body>
</html>
